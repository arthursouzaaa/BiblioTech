openapi: 3.0.0
info:
  title: API Biblioteca
  description: API RESTful para gerenciamento de biblioteca (livros, usuários, empréstimos)
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Servidor de desenvolvimento

paths:
  # -------------------- Autenticação --------------------
  /api/login:
    post:
      tags:
        - Autenticação
      summary: Realiza login e retorna token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: admin@email.com
                senha:
                  type: string
                  example: 123456
              required:
                - email
                - senha
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  usuario:
                    type: object
                    properties:
                      id:
                        type: integer
                      nome:
                        type: string
                      email:
                        type: string
                      perfil:
                        type: string
        '400':
          description: Dados inválidos
        '401':
          description: Credenciais inválidas
        '500':
          description: Erro interno

  /api/registro:
    post:
      tags:
        - Autenticação
      summary: Cadastra um novo usuário (comum)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  example: João Silva
                email:
                  type: string
                  example: joao@email.com
                senha:
                  type: string
                  example: 123456
              required:
                - nome
                - email
                - senha
      responses:
        '201':
          description: Usuário cadastrado com sucesso
        '400':
          description: Dados inválidos
        '409':
          description: E-mail já cadastrado
        '500':
          description: Erro interno

  # -------------------- Livros --------------------
  /livro:
    post:
      tags:
        - Livros
      summary: Cria um novo livro (requer token e admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LivroInput'
      responses:
        '201':
          description: Livro criado
        '400':
          description: Dados inválidos
        '401':
          description: Token não fornecido ou inválido
        '403':
          description: Sem permissão de administrador
        '500':
          description: Erro interno

  /livros:
    get:
      tags:
        - Livros
      summary: Lista todos os livros (requer token)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de livros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Livro'
        '401':
          description: Token não fornecido ou inválido
        '404':
          description: Nenhum livro encontrado
        '500':
          description: Erro interno

  /livro/categoria/:
    get:
      tags:
        - Livros
      summary: Busca livros por categoria (requer token)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: categoria
          schema:
            type: string
          required: true
          description: Nome da categoria (pode ser parcial)
      responses:
        '200':
          description: Lista de livros da categoria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Livro'
        '400':
          description: Categoria inválida
        '401':
          description: Token não fornecido ou inválido
        '404':
          description: Nenhum livro encontrado
        '500':
          description: Erro interno

  /livro/nome:
    get:
      tags:
        - Livros
      summary: Busca livros por título (requer token)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: titulo
          schema:
            type: string
          required: true
          description: Parte do título do livro
      responses:
        '200':
          description: Lista de livros encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Livro'
        '400':
          description: Título inválido
        '401':
          description: Token não fornecido ou inválido
        '404':
          description: Nenhum livro encontrado
        '500':
          description: Erro interno

  /livro/editar/{id}:
    put:
      tags:
        - Livros
      summary: Atualiza todos os dados de um livro (requer token e admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID do livro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LivroInput'
      responses:
        '200':
          description: Livro atualizado
        '400':
          description: Dados inválidos
        '401':
          description: Token não fornecido ou inválido
        '403':
          description: Sem permissão de administrador
        '404':
          description: Livro não encontrado
        '500':
          description: Erro interno

  /livro/{id}:
    delete:
      tags:
        - Livros
      summary: Exclui um livro (requer token e admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID do livro
      responses:
        '200':
          description: Livro excluído com sucesso
        '400':
          description: ID inválido
        '401':
          description: Token não fornecido ou inválido
        '403':
          description: Sem permissão de administrador
        '404':
          description: Livro não encontrado
        '500':
          description: Erro interno

  # -------------------- Usuários --------------------
  /usuario:
    post:
      tags:
        - Usuários
      summary: Cria um novo usuário (requer token e admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                email:
                  type: string
                senha:
                  type: string
                perfil:
                  type: string
                  enum: [comum, administrador]
                  default: comum
              required:
                - nome
                - email
                - senha
      responses:
        '201':
          description: Usuário criado
        '400':
          description: Dados inválidos
        '401':
          description: Token não fornecido ou inválido
        '403':
          description: Sem permissão de administrador
        '409':
          description: E-mail já cadastrado
        '500':
          description: Erro interno

  /usuarios:
    get:
      tags:
        - Usuários
      summary: Lista todos os usuários (requer token e admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        '401':
          description: Token não fornecido ou inválido
        '403':
          description: Sem permissão de administrador
        '404':
          description: Nenhum usuário encontrado
        '500':
          description: Erro interno

  /usuario/email/:
    get:
      tags:
        - Usuários
      summary: Busca usuários por email (requer token e admin)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: email
          schema:
            type: string
          required: true
          description: Parte do email do usuário
      responses:
        '200':
          description: Lista de usuários encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        '400':
          description: Email inválido
        '401':
          description: Token não fornecido ou inválido
        '403':
          description: Sem permissão de administrador
        '404':
          description: Nenhum usuário encontrado
        '500':
          description: Erro interno

  /usuario/editar/{id}:
    put:
      tags:
        - Usuários
      summary: Atualiza todos os dados de um usuário (requer token e admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID do usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                email:
                  type: string
                senha:
                  type: string
                perfil:
                  type: string
                  enum: [comum, administrador]
              required:
                - nome
                - email
                - senha
                - perfil
      responses:
        '200':
          description: Usuário atualizado
        '400':
          description: Dados inválidos
        '401':
          description: Token não fornecido ou inválido
        '403':
          description: Sem permissão de administrador
        '404':
          description: Usuário não encontrado
        '500':
          description: Erro interno

  /usuario/{id}:
    delete:
      tags:
        - Usuários
      summary: Exclui um usuário (requer token e admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID do usuário
      responses:
        '200':
          description: Usuário deletado
        '400':
          description: ID inválido
        '401':
          description: Token não fornecido ou inválido
        '403':
          description: Sem permissão de administrador
        '404':
          description: Usuário não encontrado
        '500':
          description: Erro interno

  # -------------------- Empréstimos --------------------
  /emprestimo:
    post:
      tags:
        - Empréstimos
      summary: Cria um novo empréstimo (requer token e admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmprestimoInput'
      responses:
        '201':
          description: Empréstimo criado
        '400':
          description: Dados inválidos
        '401':
          description: Token não fornecido ou inválido
        '403':
          description: Sem permissão de administrador
        '500':
          description: Erro interno

  /emprestimos:
    get:
      tags:
        - Empréstimos
      summary: Lista todos os empréstimos (requer token)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de empréstimos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Emprestimo'
        '401':
          description: Token não fornecido ou inválido
        '404':
          description: Nenhum empréstimo encontrado
        '500':
          description: Erro interno

  /emprestimo/editar/{id}:
    put:
      tags:
        - Empréstimos
      summary: Atualiza todos os dados de um empréstimo (requer token e admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID do empréstimo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmprestimoInput'
      responses:
        '200':
          description: Empréstimo atualizado
        '400':
          description: Dados inválidos
        '401':
          description: Token não fornecido ou inválido
        '403':
          description: Sem permissão de administrador
        '404':
          description: Empréstimo não encontrado
        '500':
          description: Erro interno

  /emprestimo/{id}:
    delete:
      tags:
        - Empréstimos
      summary: Exclui um empréstimo (requer token e admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID do empréstimo
      responses:
        '200':
          description: Empréstimo excluído
        '400':
          description: ID inválido
        '401':
          description: Token não fornecido ou inválido
        '403':
          description: Sem permissão de administrador
        '404':
          description: Empréstimo não encontrado
        '500':
          description: Erro interno

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Livro:
      type: object
      properties:
        id:
          type: integer
        titulo:
          type: string
        autor:
          type: string
        categoria:
          type: string
        ano:
          type: integer
      example:
        id: 1
        titulo: O Senhor dos Anéis
        autor: J.R.R. Tolkien
        categoria: Fantasia
        ano: 1954

    LivroInput:
      type: object
      properties:
        titulo:
          type: string
        autor:
          type: string
        categoria:
          type: string
        ano:
          type: integer
      required:
        - titulo
        - autor
        - categoria
        - ano
      example:
        titulo: O Senhor dos Anéis
        autor: J.R.R. Tolkien
        categoria: Fantasia
        ano: 1954

    Usuario:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
        perfil:
          type: string
      example:
        id: 1
        nome: João Silva
        email: joao@email.com
        perfil: comum

    Emprestimo:
      type: object
      properties:
        id:
          type: integer
        livro_id:
          type: integer
        usuario_id:
          type: integer
        data_emprestimo:
          type: string
          format: date
        data_devolucao:
          type: string
          format: date
        status:
          type: string
        livro_titulo:
          type: string
        usuario_nome:
          type: string
      example:
        id: 1
        livro_id: 1
        usuario_id: 1
        data_emprestimo: 2026-08-11
        data_devolucao: 2026-09-11
        status: Ativo
        livro_titulo: O Senhor dos Anéis
        usuario_nome: João Silva

    EmprestimoInput:
      type: object
      properties:
        livro_id:
          type: integer
        usuario_id:
          type: integer
        data_emprestimo:
          type: string
          format: date
        data_devolucao:
          type: string
          format: date
        status:
          type: string
          enum: [Ativo, Concluído, Em atraso, Cancelado]
      required:
        - livro_id
        - usuario_id
        - data_emprestimo
        - data_devolucao
      example:
        livro_id: 1
        usuario_id: 1
        data_emprestimo: 2026-08-11
        data_devolucao: 2026-09-11
        status: Ativo